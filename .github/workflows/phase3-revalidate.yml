name: Revalidate Ramone Phase 3 branch

on:
  push:
    branches: [feat/security-txt]
    paths:
      - ".github/workflows/phase3-revalidate.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase3-revalidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: feat/security-txt
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: "22"
      - name: Validate Ramone source and Worker bundle
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run lint
          npm test -- --run
          npm run verify:interface
          npx wrangler deploy --dry-run
          git diff --check
      - name: Commit validation marker
        run: |
          set -euo pipefail
          printf '%s\n' '{"schema_version":"atlas-systems/ramone-phase3-validation/v1","result":"pass"}' > .phase3-revalidation.json
          git add .phase3-revalidation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record Ramone Phase 3 validation"
          git push origin HEAD:feat/security-txt
