name: Prepare Ramone social preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase2-ramone-social-preview.yml"
      - "src/frontend.js"
      - "tests/interface-shell.test.js"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-phase2-ramone-social-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ramone-social-preview-card'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prove the central Ramone card is live
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://atlas-systems.uk/og/ramone.png \
            --output "${RUNNER_TEMP}/ramone.png"
          CARD_PATH="${RUNNER_TEMP}/ramone.png" python3 - <<'PY'
          import os
          import struct
          from pathlib import Path
          data = Path(os.environ["CARD_PATH"]).read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Ramone card is not a PNG")
          if struct.unpack(">II", data[16:24]) != (1200, 630):
              raise SystemExit("Ramone card is not 1200x630")
          PY

      - name: Materialize Ramone metadata and tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frontend = Path("src/frontend.js")
          source = frontend.read_text(encoding="utf-8")
          old_card = "https://atlas-systems.uk/og-default.png"
          new_card = "https://atlas-systems.uk/og/ramone.png"
          if source.count(old_card) != 2:
              raise SystemExit("expected exactly two generic Ramone card references")
          source = source.replace(old_card, new_card)
          old_alt = '<meta property="og:image:alt" content="Ramone: the Atlas Systems grounded local-AI interface" />'
          new_alt = '<meta property="og:image:alt" content="Ramone. Local AI, self-hosted. // Atlas Systems" />'
          if source.count(old_alt) != 1:
              raise SystemExit("expected the existing Ramone Open Graph alt tag")
          source = source.replace(old_alt, new_alt)
          twitter_image = f'<meta name="twitter:image" content="{new_card}" />'
          twitter_alt = '<meta name="twitter:image:alt" content="Ramone. Local AI, self-hosted. // Atlas Systems" />'
          if twitter_alt not in source:
              if source.count(twitter_image) != 1:
                  raise SystemExit("expected one Ramone Twitter image tag")
              source = source.replace(twitter_image, f"{twitter_image}\n{twitter_alt}")
          frontend.write_text(source, encoding="utf-8")

          tests = Path("tests/interface-shell.test.js")
          suite = tests.read_text(encoding="utf-8")
          anchor = '    expect(rendered).toContain(\'property="og:image:alt"\');\n'
          addition = '''    expect(rendered).toContain('property="og:image" content="https://atlas-systems.uk/og/ramone.png"');\n    expect(rendered).toContain('name="twitter:image" content="https://atlas-systems.uk/og/ramone.png"');\n    expect(rendered).toContain('property="og:image:alt" content="Ramone. Local AI, self-hosted. // Atlas Systems"');\n    expect(rendered).toContain('name="twitter:image:alt" content="Ramone. Local AI, self-hosted. // Atlas Systems"');\n'''
          if addition not in suite:
              if suite.count(anchor) != 1:
                  raise SystemExit("could not locate Ramone metadata test anchor")
              suite = suite.replace(anchor, addition)
          tests.write_text(suite, encoding="utf-8")
          PY

      - name: Validate generated source
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run lint
          npm test -- --run
          npm run verify:interface
          git diff --check

      - name: Commit generated source
        run: |
          set -euo pipefail
          git add src/frontend.js tests/interface-shell.test.js
          if git diff --cached --quiet
          then
            echo "Ramone metadata is already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: use the Ramone social preview card"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
