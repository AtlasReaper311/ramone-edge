name: Branch lockfile refresh

on:
  push:
    branches:
      - fix/npm-maintenance-2026-09

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/npm-maintenance-2026-09
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate and verify lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          if (packages['node_modules/@cloudflare/vitest-pool-workers']) {
            throw new Error('deprecated @cloudflare/vitest-pool-workers remains in lockfile');
          }
          const braces = Object.entries(packages)
            .filter(([path]) => path.endsWith('/brace-expansion') || path === 'node_modules/brace-expansion')
            .map(([, value]) => value.version);
          if (!braces.length || braces.some((version) => version !== '5.0.9')) {
            throw new Error(`unexpected brace-expansion versions: ${braces.join(', ')}`);
          }
          const sharp = Object.entries(packages)
            .filter(([path]) => path.endsWith('/sharp') || path === 'node_modules/sharp')
            .map(([, value]) => value.version);
          if (sharp.some((version) => version === '0.35.2')) {
            throw new Error('vulnerable sharp 0.35.2 remains in lockfile');
          }
          NODE
          git diff --check

      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate npm lockfile'
          git push origin HEAD:fix/npm-maintenance-2026-09
